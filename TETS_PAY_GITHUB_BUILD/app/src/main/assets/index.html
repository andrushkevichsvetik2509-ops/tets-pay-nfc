<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>TETS PAY</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f4f6ff;font:15px system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(440px,100%);background:#111827;border:1px solid #2a354a;border-radius:26px;padding:22px;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:23px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8d7cff,#42dbc2);color:#080b12;display:grid;place-items:center;font-weight:1000}.muted{color:#94a3b8;font-size:13px}.balance{margin:20px 0;background:#0b1220;border:1px solid #263249;border-radius:18px;padding:17px}.balance strong{display:block;font-size:32px;margin-top:4px}.field{display:block;margin:14px 0 6px;color:#b9c4d8;font-size:13px}input{width:100%;padding:14px;border-radius:12px;background:#0a101b;border:1px solid #344158;color:white;font-size:16px;outline:none}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(110deg,#8174ff,#5f6ce9);color:white;font-weight:800;font-size:15px;margin-top:14px}button.secondary{background:#202b3d;border:1px solid #344158}.status{display:none;margin-top:16px;padding:15px;border-radius:14px;background:#0b1220;border:1px solid #344158;line-height:1.5}.history{margin-top:18px;border-top:1px solid #2a354a;padding-top:14px;font-size:13px;color:#aebbd0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffc76a;margin-right:7px}.success{color:#45e0ad}.hint{margin-top:13px;font-size:12px;color:#8392ac;line-height:1.5}
</style></head><body><main class="app"><div class="brand"><div class="logo">T</div><div>TETS PAY<div class="muted">ИГРОВОЙ NFC-ТЕРМИНАЛ</div></div></div><section class="balance"><div class="muted">Баланс игрового счёта</div><strong id="balance">10 000 ₽</strong><div class="muted">Только для игры — не реальные деньги</div></section><label class="field" for="product">Название товара</label><input id="product" value="Кола" maxlength="50"><label class="field" for="amount">Сумма, ₽</label><input id="amount" type="number" min="1" max="10000" value="150"><button onclick="startPay()">PAY · Оплатить</button><button class="secondary" onclick="payerMode()">Режим покупателя / NFC-карта</button><div class="status" id="status"></div><div class="history" id="history">История операций: пока пусто</div><div class="hint">Для игрового NFC-обмена оба телефона должны поддерживать нужные NFC-режимы. Если NFC недоступен, терминал покажет это. Реальные банковские платежи не выполняются.</div></main><script>
let balance=10000;const $=id=>document.getElementById(id);function showStatus(html){$('status').style.display='block';$('status').innerHTML=html}function startPay(){let p=$('product').value.trim()||'Товар',a=Number($('amount').value);if(!Number.isFinite(a)||a<1||a>balance){showStatus('Проверь сумму: от 1 ₽ до '+balance+' ₽.');return}showStatus('<span class="dot"></span>Подготовка терминала…');setTimeout(()=>showStatus('<span class="dot"></span>Ожидание второго телефона. Приложите телефоны друг к другу…'),900);if(window.AndroidNfc)AndroidNfc.startScan();window._pending={p,a};}window.onNfcDetected=function(){if(!window._pending){showStatus('NFC обнаружен. Теперь нажмите «PAY · Оплатить».');return}let {p,a}=window._pending;showStatus('<span class="dot"></span>NFC обнаружен. Проверяем игровой токен…');setTimeout(()=>{balance-=a;$('balance').textContent=balance.toLocaleString('ru-RU')+' ₽';showStatus('<span class="success">✓ ОПЛАТА УСПЕШНА</span><br>'+p+' — '+a.toLocaleString('ru-RU')+' ₽<br>Игровая операция подтверждена.');$('history').innerHTML='<b>Последняя операция</b><br>'+new Date().toLocaleTimeString('ru-RU')+' · '+p+' · −'+a.toLocaleString('ru-RU')+' ₽';try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.25;o.start();setTimeout(()=>{o.frequency.value=1175},120);setTimeout(()=>{o.stop();c.close()},480)}catch(e){}window._pending=null},1200)};function payerMode(){if(window.AndroidNfc)AndroidNfc.setPayerMode(true);showStatus('Режим покупателя выбран.<br><br>Разблокируйте телефон и включите NFC в настройках. Держите приложение открытым. Этот режим использует игровой токен, а не банковскую карту.');}
</script></body></html>
